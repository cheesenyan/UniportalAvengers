
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniPortal - Success</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h1>UniPortal</h1>
        <p class="subtitle">Registration Result</p>

        <h2 class="success-title">Registration Successful!</h2>

        <p style="text-align: center; margin: 20px 0;">
            Your course has been successfully registered.
        </p>

        <div class="course-info">
            <p><strong>Student ID:</strong> <span id="studentID"></span></p>
            <p><strong>Course:</strong> <span id="courseCode"></span></p>
            <p><strong>Course Name:</strong> <span id="courseName"></span></p>
        </div>

        <button onclick="goDashboard()">Back to Dashboard</button>
    </div>

    <script>
        if (sessionStorage.getItem("registrationStatus") !== "success") {
            window.location.href = "index.html";
        }

        document.getElementById("studentID").textContent =
            sessionStorage.getItem("studentID") || "";

        document.getElementById("courseCode").textContent =
            sessionStorage.getItem("selectedCourseCode") || "";

        document.getElementById("courseName").textContent =
            sessionStorage.getItem("selectedCourseName") || "";

        function goDashboard() {
            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
